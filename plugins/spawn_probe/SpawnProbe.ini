; SpawnProbe.dll settings (bin\plugins\SpawnProbe.ini). Read once at game start.
[probe]
; only vehicles whose sysname starts with this are probed
filter=Probe_
; squad to spawn (squads.xml sysname); its team is the vehicle's
squad=Lgn_swarm
; ... for one vehicle: squad_<vehicle sysname>
squad_Probe_gun_van=Probe_bomb_uav
; the UAV kit: one round of it is spent per spawn (a vehicle that carries it but has none left spawns nothing)
ammo=uav_kit
; metres from the vehicle along the world X axis
offset=8
; spawns per game run, at most
max_spawns=10
; how the squad dies when the vehicle packs up: detonate (as bomb drones do) or queue (the mission kill action)
kill=detonate
